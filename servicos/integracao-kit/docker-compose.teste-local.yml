# ==============================================================================
# Contorno OPCIONAL, só para teste local, enquanto o kit não for corrigido.
#
# No kit (commit 630515c), o pg-primary sobe com synchronous_commit=on e
# synchronous_standby_names='pg_replica'. Durante a inicialização do banco, o
# PostgreSQL só aceita conexões pelo socket local, a réplica não consegue se
# conectar e o CREATE DATABASE fica esperando por ela para sempre: o banco
# portal_b2b nunca é criado. Este arquivo sobe o primário sem esperar réplica.
# Detalhes em README.md (nesta pasta). Não usar como solução definitiva.
# ==============================================================================

services:
  pg-primary:
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c max_replication_slots=10
